<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/demo-amiin/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Amiin — votre secrétaire personnel à Djibouti">
  <meta name="theme-color" content="#14213D">
  <meta name="robots" content="noindex, nofollow">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Amiin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Amiin</title>
  <link rel="manifest" href="manifest.json">

  <!-- Pré-loader affiché pendant le téléchargement du moteur Flutter.
       Retiré automatiquement dès que Flutter dessine sa première frame
       (Flutter vide le body avant d'attacher sa vue). -->
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #F2EFE9;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #14213D; }
      #amiin-loader { background: #14213D !important; }
      #amiin-loader .name { color: #F2EFE9 !important; }
      #amiin-loader .bar { background: rgba(255, 255, 255, 0.10) !important; }
    }
    #amiin-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #F2EFE9;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #amiin-loader .name {
      color: #14213D;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 12px;
      margin-left: 12px; /* compense le letter-spacing du dernier caractère */
      animation: amiin-pulse 1.6s ease-in-out infinite;
    }
    #amiin-loader .bar {
      width: 180px;
      height: 4px;
      border-radius: 2px;
      background: rgba(20, 33, 61, 0.12);
      overflow: hidden;
    }
    #amiin-loader .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: #1E8A8A;
      animation: amiin-slide 1.3s ease-in-out infinite;
    }
    @keyframes amiin-pulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }
    @keyframes amiin-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>

  <!-- Flutter n'ajoute pas cette balise quand il dessine dans un conteneur :
       sans elle, un téléphone afficherait la page en largeur « ordinateur ». -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- Format téléphone : sur grand écran, l'app tient dans un cadre de
       téléphone centré ; sur mobile, elle occupe tout l'écran. -->
  <style id="amiin-phone-format">
    #amiin-phone { position: fixed; inset: 0; }
    @media (min-width: 600px) and (min-height: 560px) {
      html, body { background: radial-gradient(circle at 30% 20%, #FFFFFF 0%, #ECE9E2 60%, #E2DED5 100%); }
      #amiin-phone {
        inset: auto;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        height: min(844px, calc(100vh - 48px));
        /* proportions d'un iPhone, mais jamais moins large qu'un petit
           téléphone (360 px) sur les écrans peu hauts */
        width: max(360px, calc(min(844px, calc(100vh - 48px)) * 390 / 844));
        border-radius: 44px;
        overflow: hidden;
        background: #F2EFE9;
        box-shadow:
          0 0 0 10px #14213D,
          0 0 0 11px rgba(255, 255, 255, 0.08),
          0 40px 80px -20px rgba(20, 33, 61, 0.45),
          0 12px 30px -10px rgba(20, 33, 61, 0.30);
      }
    }
    @media (min-width: 600px) and (min-height: 560px) and (prefers-color-scheme: dark) {
      html, body { background: radial-gradient(circle at 30% 20%, #22335A 0%, #14213D 60%, #0D1526 100%); }
      #amiin-phone { box-shadow: 0 0 0 10px #05080F, 0 0 0 11px rgba(255,255,255,0.10), 0 40px 80px -20px rgba(0,0,0,0.6); }
    }
  </style>
</head>
<body>
  <div id="amiin-loader">
    <div class="name">AMIIN</div>
    <div class="bar"></div>
  </div>
  <script>
    // Sécurité : retire le loader dès la première frame Flutter
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('amiin-loader');
      if (el) el.remove();
    });
  </script>
  <div id="amiin-phone"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
